# Official-aligned rl_games config for LEAP ADR parity.

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True

    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

    rnn:
      name: gru
      units: 256
      layers: 1
      before_mlp: true
      concat_input: true
      layer_norm: true

  load_checkpoint: False
  load_path: ''

  config:
    name: leap_hand_reorient
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 5e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.02
    score_to_win: 100000
    max_epochs: 2000
    save_best_after: 100
    save_frequency: 200
    print_stats: True
    rsl_style_console: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 32768
    mini_epochs: 5
    critic_coef: 4
    clip_value: True
    clip_actions: False
    seq_length: 4
    bounds_loss_coef: 0.0001

    player:
      deterministic: True
      games_num: 100000
      print_stats: True

  pbt:
    enabled: False
    policy_idx: 0
    num_policies: 6
    directory: .
    workspace: pbt_workspace
    objective: episode.Episode_Reward/official_reward
    interval_steps: 2000000
    threshold_std: 0.1
    threshold_abs: 0.05
    mutation_rate: 0.25
    change_range: [1.1, 2.0]
    mutation:
      agent.params.config.learning_rate: mutate_float
      agent.params.config.entropy_coef: mutate_float
      agent.params.config.grad_norm: mutate_float
      agent.params.config.gamma: mutate_discount
      agent.params.config.tau: mutate_discount
