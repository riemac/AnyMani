[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anymani"
version = "1.0.1"
description = "Cross-embodiment in-hand rotation via contact geometry learning"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{name = "Aochen He"}, {name = "Gangshan Jing"}]
dependencies = [
  "torch==2.7.0",
  "numpy==1.26.4",
  "h5py==3.15.1",
  "PyYAML==6.0.2",
  "psutil==5.9.8",
]

[project.optional-dependencies]
geometry = [
  "trimesh==4.5.1",
  "manifold3d==3.5.2",
  "scipy==1.15.3",
  "rtree==1.3.0",
  "warp-lang==1.10.0",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "tqdm==4.67.1",
  "tensorboard==2.20.0",
]
simulation = [
  "gymnasium==1.2.1",
  "gym==0.23.1",
  "rl-games @ git+https://github.com/Denys88/rl_games.git@36edd38823197e6e20c6cc4531765e654d13b80f",
  "polars==1.32.3",
  "Pillow==11.3.0",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "wandb==0.23.0",
  "click==8.1.7",
  "tensorboardX==2.6.4",
  "protobuf==6.33.5",
]
dev = ["pytest>=8,<9", "ruff>=0.14"]

[project.urls]
Homepage = "https://riemac.github.io/AnyMani/"
Repository = "https://github.com/riemac/AnyMani"

[tool.setuptools]
package-dir = {"" = "source/anymani"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["source/anymani"]
include = ["anymani*"]
namespaces = true

[tool.setuptools.package-data]
anymani = ["**/*.yaml", "**/*.json", "**/*.stl"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
