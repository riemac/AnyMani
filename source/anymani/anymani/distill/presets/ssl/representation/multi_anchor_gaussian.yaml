# q-independent physical source realization。
defaults:
  - schema_multi_anchor_gaussian
  - _self_

source:
  home_points_per_owner: 64
  home_surface_oversample_factor: 8
  anchors_per_finger: 10
  anchor_radius_m: 0.05
  anchor_radial_decay_scale_m: 0.025
  anchor_surface_fraction: 0.5
  static_sampling_seed: 0

# 显式米制 Gaussian field measure。
field:
  bandwidth_centers_m: [0.004, 0.016, 0.064]
  bandwidth_jitter_relative: 0.10
  validation_bandwidths_m: [0.004, 0.008, 0.016, 0.032, 0.064]

# 每 owner 64 queries，workspace/shell/adjacent = 32/16/16。
query:
  query_count: 64
  workspace_fraction: 0.50
  owner_shell_fraction: 0.25
  adjacent_fraction: 0.25
  workspace_radius_m: 0.05
  shell_offset_min_m: 0.0005
  shell_offset_max_m: 0.004
  adjacent_candidate_count: 4

# 每 owner 两条 sampled kappa edges 与保守局部非光滑 mask。
target:
  edges_per_owner: 2
  distance_epsilon_m: 1.0e-6
  feature_margin_min_m: 1.0e-5

# 跨结构稠密容器上限；padding 不改变真实统计测度。
layout:
  max_joint_count: 20
  max_tip_count: 5
  max_graph_distance: 8
