# GM single-asset MDP probe 的 MLP PPO 配置。
# 目标是验证 pre-made mother asset 上当前 GM MDP 是否能学会手内重定向，
# 不是验证 transformer、geometry token 或 morphology generalization。

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          # fixed log sigma；$\exp(-0.5)\approx0.61$，经 action scale=0.1 后给约 0.06 rad 探索步长。
          val: -0.5
        fixed_sigma: True

    mlp:
      # single-asset MLP probe 对齐 AnyRotate / IsaacLab / LEAP 常见 teacher 宽度，容量足够且比 [512,512,256] 更稳。
      units: [512, 256, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: gm_single_asset_mlp
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    torch_compile: False
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 5e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 10000
    save_best_after: 200
    save_frequency: 200
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.002
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 16384
    mini_epochs: 5
    critic_coef: 4.0
    clip_value: True
    clip_actions: False
    seq_length: 1
    bounds_loss_coef: 0.0001

    player:
      deterministic: True
      games_num: 64
      print_stats: True
