# GM teacher PPO 配置：distill 自包含训练入口使用。
# 网络是 `anymani_gm_transformer`，不是 MLP baseline。

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd


  network:
    name: anymani_gm_transformer
    separate: false

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -1.5
        fixed_sigma: true

    transformer:
      embed_dim: 128
      num_layers: 3
      num_heads: 4
      dropout: 0.0
      token_feature_dim: 5
      command_feature_dim: 6

  load_checkpoint: false
  load_path: ''

  config:
    name: gm_teacher_transformer_debug
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    torch_compile: false
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 200
    save_best_after: 50
    save_frequency: 50
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.002
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 8192
    mini_epochs: 5
    critic_coef: 4.0
    clip_value: true
    clip_actions: false
    seq_length: 1
    bounds_loss_coef: 0.0001

    player:
      deterministic: true
      games_num: 16
      print_stats: true
