# GM in-hand 默认 hand selection 的 MLP PPO smoke 配置。
# 目标不是策略表现，而是验证当前 same-topology generated hand preset 能进入
# rl_games 的 rollout / backward / optimizer / checkpoint 闭环。

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -1.0
        fixed_sigma: True

    mlp:
      units: [128, 128]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: gm_inhand_mlp_smoke_default
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    torch_compile: False
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 3e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 2
    save_best_after: 1
    save_frequency: 1
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 4
    minibatch_size: 1024
    mini_epochs: 1
    critic_coef: 2.0
    clip_value: True
    clip_actions: False
    seq_length: 1
    bounds_loss_coef: 0.0001

    player:
      deterministic: True
      games_num: 16
      print_stats: True
