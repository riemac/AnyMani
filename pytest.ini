[pytest]
# Default suite: contract-only.
#
# These paths must stay free of Isaac Sim / Kit / AppLauncher startup. Runtime
# physics checks live under `source/anymani/anymani/smokes/` and are run by
# explicitly passing that path to pytest through `isaaclab.sh`.
testpaths =
    source/anymani/anymani/assets/tests
    source/anymani/anymani/tools/tests
    source/anymani/anymani/tasks/gm/tests
    source/anymani/anymani/tasks/hetero/tests
    source/anymani/anymani/tasks/inhand/tests
    source/anymani/anymani/robots/tests
    source/anymani/anymani/pregrasp/tests
    source/anymani/anymani/distill/tests

# Be explicit to avoid accidental plugin loading from environment (double safety)
# If some plugin name appears, you can disable it here, e.g.,
# -p no:launch_testing
addopts = -q -m "not performance and not training_sanity"

markers =
    contract: pure Python / tensor / config contract tests, safe for default pytest
    isaacsim: headless Isaac Sim smoke tests, run explicitly through isaaclab.sh
    performance: explicit hardware-bound latency / memory regression tests, never run by default
    training_sanity: short rollout/training sanity checks, run explicitly and never as default pytest
