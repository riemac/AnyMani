# 80 generated hands、rank-0 palm pregrasp、N000任务语义下的共享structured PPO。
# Actor与privileged critic由AnyMani custom agent完全分参；N040在vec-env rollout边界以BF16仅计算一次，
# FP32 Z作为Dict experience side-channel缓存，5个mini-epochs不会重算encoder。

params:
  seed: 42

  env:
    clip_observations: 100.0  # raw task tensors的宽松finite guard；N040 Z不经过该clip
    clip_actions: 1.0         # canonical relative action transport范围[-1,1]

  algo:
    name: anymani_palm_rotation_ppo

  model:
    name: anymani_palm_rotation_masked_continuous  # mean-preserving tanh-squashed masked Normal

  network:
    name: anymani_palm_rotation
    palm_rotation:
      residual_enabled: true         # base-only短matched arm由CLI显式覆盖为false
      initial_log_std: -0.5          # 一个global scalar log sigma，exp(-0.5)约0.607
      max_log_std: -0.43             # N000同transition预算约sigma=0.65；抑制clamp-driven jitter
      base_action_limit: 0.8         # base 80% authority + global residual 20% = exact [-1,1] mean

  load_checkpoint: false
  load_path: ''

  config:
    name: heterogeneous_palm_rotation_mvp_residual
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: false
    ppo: true
    mixed_precision: false           # actor、critic、loss与两套optimizer均保持FP32
    normalize_input: false           # actor raw packet不做running input normalization
    normalize_value: true            # 全80资产共同维护global value normalization
    normalize_advantage: true        # 全76,800 rollout batch共同标准化GAE
    value_bootstrap: true
    torch_compile: false
    rsl_style_console: true
    num_actors: 2560                 # 80 assets × 32 replicas；唯一fallback为1280
    asset_count: 80
    reward_shaper:
      scale_value: 1.0
    gamma: 0.99
    tau: 0.95
    learning_rate: 3.0e-4            # TCN/local/base/head/global log_std
    adaptive_lr_max: 3.0e-4           # KL scheduler只可降低/恢复，不得越过方法LR锚点
    residual_learning_rate: 1.0e-4   # one-block graph residual branch
    critic_learning_rate: 5.0e-4     # completely independent privileged critic Adam
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.01               # custom agent按active DoF均值计算KL
    score_to_win: 100000
    max_epochs: 6400                 # seed42总上限491.52M transitions
    save_best_after: 128
    save_frequency: 128
    evaluation_frequency: 320      # 另存完整checkpoint供隔离进程固定评估
    print_stats: true
    grad_norm: 1.0                   # actor与critic分别clip，不做联合norm
    entropy_coef: 0.002
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 30
    minibatch_size: 4800             # launcher正式默认16份；2560 env时每份80 assets × 60 samples
    gradient_accumulation_steps: 4   # 4个activation slices恢复一个19,200-sample逻辑minibatch
    mini_epochs: 5
    critic_coef: 4.0
    clip_value: true
    clip_actions: false              # action在MVP vec-env边界clip，避免二次rescale
    seq_length: 1                    # History30属于observation，actor不是rl_games RNN
    bounds_loss_coef: 1.0e-4
    diagnostics_flush_updates: 50   # checkpoint前另行强制flush，不允许checkpoint领先于Parquet
    gpu_memory_fraction_limit: 0.85  # scene+rollout buffer+model+optimizers的CUDA allocated峰值门

    player:
      deterministic: true
      games_num: 80
      print_stats: true
