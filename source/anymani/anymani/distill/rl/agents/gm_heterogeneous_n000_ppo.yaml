# 2048 canonical assets 的 N000 current-frame + frozen-Z heterogeneous PPO 基础设施 preset。
# actor 的 environment flat group 为 69D：52D deployable frame + asset_row1 + active_mask16；
# 后 17D 仅参与 manifest routing，不进入连续 actor feature。critic 独立消费 103D privileged state。

params:
  seed: 42

  env:
    # asset_row 最大为 2047，不能用常见的 10.0 全 observation clamp；物理 frame 已由 MDP 自身归一化。
    clip_observations: 1000000.0
    clip_actions: 1.0

  algo:
    name: anymani_masked_ppo

  model:
    name: anymani_masked_continuous

  network:
    name: anymani_heterogeneous_n000_masked
    separate: False
    heterogeneous_policy:
      owner_feature_dim: 1  # 四个 TIP contact bits；PALM/JOINT task features 为结构零
      joint_feature_dim: 3  # 每个 canonical joint 的 q/pi、target/pi、previous policy action
      geometry_entity_width: 128  # frozen Z 接口宽度 [B,21,128]
      hidden_width: 128
      layers: 2
      attention_heads: 4
      feedforward_width: 256
      dropout: 0.0
      initial_log_std: -0.5  # 所有 active joints 共享一个 trainable global log-std

  load_checkpoint: False
  load_path: ''

  config:
    name: gm_heterogeneous_n000
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: False  # asset_row/mask metadata 不允许进入 running-mean normalization
    normalize_value: True
    value_bootstrap: True
    use_experimental_cv: False  # actor placeholder value 不参与 loss；advantage 只由 central critic 产生
    torch_compile: False
    rsl_style_console: True
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 5.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 10000
    save_best_after: 200
    save_frequency: 200
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.002
    truncate_grads: True
    e_clip: 0.2

    # Infra-stage 数值锚点：2048x1 给 32768 transitions，2048x2 给 65536；两者均被 4096 整除。
    horizon_length: 16
    minibatch_size: 4096
    mini_epochs: 2
    critic_coef: 4.0
    clip_value: True
    clip_actions: False
    seq_length: 1
    bounds_loss_coef: 0.0001

    central_value_config:
      minibatch_size: 4096
      mini_epochs: 2
      learning_rate: 5.0e-4
      clip_value: True
      normalize_input: True  # 103D privileged state 维护与 actor 完全独立的 RMS
      truncate_grads: True
      grad_norm: 1.0
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [512, 256, 128]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

    player:
      deterministic: True
      games_num: 64
      print_stats: True
