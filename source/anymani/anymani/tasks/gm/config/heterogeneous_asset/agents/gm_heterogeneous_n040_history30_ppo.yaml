# 冻结N040 + per-JOINT History30 + graph policy adapter的heterogeneous easy-tier PPO。
# Actor flat ABI为1969D；N040 artifact在runner build前严格加载，错误/缺失不得回退hash-Z。

params:
  seed: 42

  env:
    clip_observations: 1000000.0  # asset_row最大2047，routing metadata不能被普通obs clamp污染
    clip_actions: 1.0

  algo:
    name: anymani_masked_ppo

  model:
    name: anymani_masked_continuous

  network:
    name: anymani_heterogeneous_n040_history30
    separate: False
    parallel_geometry_temporal: True  # N040 side stream与trainable temporal branch在fusion前并行
    compile_policy_adapter: True      # raw policy持有checkpoint state，compiled callable优化固定shape forward/backward
    temporal_encoder: stack_mlp       # 120D ordered raw history；TCN候选在B=4096下未通过48 ms门
    retained_geometry:
      artifact_path: logs/ssl/geometry_ssl_density_material_jacobian_se3_v0_8_1_extended512_matched/20260830T164445Z/retained_encoder.pt
      artifact_sha256: cda44cc9eae5ca28a1a735176ef4764805559d13e235c52477b6ac438b20ddea
    heterogeneous_policy:
      owner_feature_dim: 1       # TIP current contact；PALM task feature为结构零
      joint_feature_dim: 6       # current q/target/action/contact + lower/upper limit margins
      temporal_feature_dim: 32   # shared per-JOINT ordered History30摘要
      geometry_entity_width: 128
      hidden_width: 128
      layers: 1                  # 两层只有在48 ms与学习证据支持时才晋升
      attention_heads: 4
      feedforward_width: 256
      dropout: 0.0
      initial_log_std: -0.5

  load_checkpoint: False
  load_path: ''

  config:
    name: gm_heterogeneous_n040_history30
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: False
    normalize_value: True
    value_bootstrap: True
    use_experimental_cv: False
    torch_compile: False
    rsl_style_console: True
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 5.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 1000
    save_best_after: 100
    save_frequency: 100
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.002
    truncate_grads: True
    e_clip: 0.2

    # History30属于observation，不使用rl_games recurrent state；rollout horizon仍是独立H=16。
    horizon_length: 16
    minibatch_size: 4096
    mini_epochs: 2
    critic_coef: 4.0
    clip_value: True
    clip_actions: False
    seq_length: 1
    bounds_loss_coef: 0.0001

    central_value_config:
      minibatch_size: 4096
      mini_epochs: 2
      learning_rate: 5.0e-4
      clip_value: True
      normalize_input: True
      truncate_grads: True
      grad_norm: 1.0
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [512, 256, 128]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

    player:
      deterministic: True
      games_num: 64
      print_stats: True
