# RTX 5070 Ti 16 GB：在线 sampling/update 算法、optimizer 与资源上限。
defaults:
  - schema_single_gpu_16gb
  - _self_

sampling:
  epochs: 20
  q_per_asset_per_epoch: 256
  assets_per_minibatch: 2
  q_per_asset_per_minibatch: 2
  shuffle_assets: true
  seed: 20260813
optimizer:
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
gradient_accumulation_steps: 4
max_gradient_norm: 10.0
max_resident_assets: 20
device: cuda:0
dtype: float32
log_every_updates: 10
checkpoint_every_updates: 1000
run_safety_step_limit: 30000
