[pytest]
# Keep tests close to the research module they validate.
testpaths =
    source/anymani/anymani/assets/tests
    source/anymani/anymani/tasks/gm/tests
    source/anymani/anymani/distill/tests

# Be explicit to avoid accidental plugin loading from environment (double safety)
# If some plugin name appears, you can disable it here, e.g.,
# -p no:launch_testing
addopts = -q
