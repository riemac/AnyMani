# GM single-asset tactile rotation 的 GRU PPO 配置。
# 环境只提供当前 52D deployment frame；rl_games 在 rollout/batch 层维护 256D GRU hidden，
# `seq_length=30` 使 BPTT 覆盖 1.5 s。privileged 152D state 只进入独立 central critic。

params:
  seed: 42

  env:
    clip_observations: 10.0  # actor 已归一化；较宽 clip 主要保护 critic 的 raw privileged state
    clip_actions: 1.0  # wrapper 输出的 $a_t^{policy}\in[-1,1]$ 正是 actor last-action 语义

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False  # asymmetric critic 由 central_value_config 提供，不由该字段提供

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -0.5  # 初始标准差 $\exp(-0.5)\approx0.61$，再由 $1/24$ action scale 转成 target increment
        fixed_sigma: True

    mlp:
      units: [512, 256, 128]  # 同 TCN actor 的 policy head 宽度
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

    rnn:
      name: gru
      units: 256
      layers: 1
      layer_norm: False
      before_mlp: True  # $h_t=GRU(x_t,h_{t-1})$，随后 policy MLP 消费 hidden
      concat_input: False  # rl_games 中只在 MLP-before-RNN 时生效，此处必须关闭
      concat_output: True  # policy MLP 显式消费 $[h_t,x_t]\in\mathbb R^{308}$

  load_checkpoint: False
  load_path: ''

  config:
    name: gm_tactile_rotation_gru
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: False  # 52D actor frame 已物理归一；避免与 TCN 的 per-position RMS 形成额外差异
    normalize_value: True
    value_bootstrap: True
    use_experimental_cv: False  # 主 actor 占位 value head 不参与 loss，价值学习只由 central critic 完成
    zero_rnn_on_done: True  # episode done 后严格清 GRU hidden，防止跨 episode 泄漏历史
    torch_compile: False
    rsl_style_console: True
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 5e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 10000
    save_best_after: 200
    save_frequency: 200
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.002
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 30  # 4096 env 时每 iteration 有 122880 transitions
    minibatch_size: 30720  # 4 minibatches；每个含 1024 条完整 30-step sequences
    mini_epochs: 5
    critic_coef: 4.0  # 主 actor critic loss 已关闭；保留 rl_games 接口字段
    clip_value: True
    clip_actions: False
    seq_length: 30
    bounds_loss_coef: 0.0001

    central_value_config:
      minibatch_size: 30720  # rl_games 不从 actor config 自动继承
      mini_epochs: 5
      learning_rate: 5e-4
      clip_value: True
      normalize_input: True  # privileged state 混合 rad、m、N、材料与 ADR 参数，需独立 RMS
      truncate_grads: True
      grad_norm: 1.0
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [512, 256, 128]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

    player:
      deterministic: True
      games_num: 64
      print_stats: True
